name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project DCDUsedCar.xcodeproj -scheme DCDUsedCar -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/DCDUsedCar.app Payload/
          zip -qry DCDUsedCar-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DCDUsedCar-unsigned-ipa
          path: DCDUsedCar-unsigned.ipa
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: DCDUsedCar-unsigned.ipa
  screens:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Simulator screenshots
        run: OUT=shots ./scripts/screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots/
