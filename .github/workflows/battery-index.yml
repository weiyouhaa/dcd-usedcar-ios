name: battery-index
# Daily 电池方案 index (蔚来/乐道/萤火虫) → branch `battery-index`, file battery-index.json
on:
  schedule:
    - cron: '0 19 * * *'   # 03:00 Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: battery-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Previous index (fallback for listings that fail today)
        run: curl -fsSL -o prev.json "https://raw.githubusercontent.com/${{ github.repository }}/battery-index/battery-index.json" || echo '{}' > prev.json
      - name: Build index
        run: python3 -u scripts/battery_index.py --prev prev.json --out out --workers 4
      - name: Publish to battery-index branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pub && cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin battery-index; then git checkout -q -b battery-index FETCH_HEAD; else git checkout -q --orphan battery-index; fi
          cp ../out/battery-index.json ../out/battery-index.json.gz .
          printf '# battery-index\nDaily 电池方案 index generated by .github/workflows/battery-index.yml on main.\n' > README.md
          git add -A
          git commit -qm "battery index $(TZ=Asia/Shanghai date '+%F %R')" || { echo "no change"; exit 0; }
          git push -q origin battery-index
      - name: Refresh CDN mirror
        run: curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@battery-index/battery-index.json" || true
