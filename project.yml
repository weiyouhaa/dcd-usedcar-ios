name: DCDUsedCar
options: {bundleIdPrefix: com.personal, deploymentTarget: {iOS: "16.0"}}
targets:
  DCDUsedCar:
    type: application
    platform: iOS
    sources: [DCDUsedCar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.dcdusedcar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 二手车搜索
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
