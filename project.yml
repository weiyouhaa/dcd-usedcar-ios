name: DCDUsedCar
options: {bundleIdPrefix: com.personal, deploymentTarget: {iOS: "16.0"}}
targets:
  DCDUsedCar:
    type: application
    platform: iOS
    sources: [DCDUsedCar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.dcdusedcar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 二手车搜索
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于定位当前城市，查看本地二手车源
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "2.5"
        CURRENT_PROJECT_VERSION: "6"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
